name: Import single-file HTML

on:
  push:
    paths:
      - .github/workflows/import-html.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch HTML
        run: |
          curl -L --fail --retry 3 --retry-delay 2 "https://aka.doubaocdn.com/s/zX1VYo698R" -o index.html
          test -s index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add particle fluid lab single-file HTML"
          git push
