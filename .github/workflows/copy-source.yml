name: Copy source archive

on:
  push:
    paths:
      - .github/workflows/copy-source.yml

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy source file
        run: |
          mkdir -p src
          cp index.html "src/粒子流体实验室.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/粒子流体实验室.html"
          git commit -m "Add original source archive"
          git push
